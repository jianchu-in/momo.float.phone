<script>/* Character card parser. No network calls. Browser + Node-compatible test export. */
(function (scope) {
  'use strict';
  const text = v => typeof v === 'string' ? v : v == null ? '' : String(v);
  const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  const arr = v => Array.isArray(v) ? v : [];
  const clone = v => JSON.parse(JSON.stringify(v));
  function normalizeCard(input) {
    if (!input || typeof input !== 'object' || Array.isArray(input)) throw new Error('文件不是有效的角色卡 JSON 对象');
    const root = clone(input);
    const data = root.data && typeof root.data === 'object' && !Array.isArray(root.data) ? root.data : root;
    if (!text(data.name || root.name).trim()) throw new Error('没有识别到角色名称，请确认是角色卡而非聊天存档');
    const ext = obj(data.extensions);
    const greetings = [text(data.first_mes ?? root.first_mes), ...arr(data.alternate_greetings ?? root.alternate_greetings).map(text)]
      .map((content, i) => ({id: 'opening_' + i, name: i ? `备用开场 ${i}` : '默认开场', content, sourceIndex: i, format: /<\/?[a-z][^>]*>/i.test(content) ? 'html' : 'text'}))
      .filter(g => g.content.length);
    const book = obj(data.character_book || data.characterBook || ext.character_book || root.character_book);
    const rawScripts = ext.regex_scripts ?? ext.regexScripts ?? root.regex_scripts ?? [];
    return {
      spec: text(root.spec || (root.data ? 'chara_card_v2' : 'legacy')), raw: root,
      name: text(data.name ?? root.name), description: text(data.description ?? root.description),
      personality: text(data.personality ?? root.personality), scenario: text(data.scenario ?? root.scenario),
      mesExample: text(data.mes_example ?? root.mes_example),
      systemPrompt: text(data.system_prompt), postHistory: text(data.post_history_instructions),
      creatorNotes: text(data.creator_notes), creator: text(data.creator), version: text(data.character_version),
      tags: arr(data.tags).map(text), greetings, worldBook: book, scripts: arr(rawScripts),
      extensions: ext, sourceFields: Object.keys(data),
    };
  }
  function updateRaw(card, patch) {
    const raw = clone(card.raw);
    const d = obj(raw.data);
    const target = raw.data && typeof raw.data === 'object' ? d : raw;
    const fields = {name:'name',description:'description',personality:'personality',scenario:'scenario',mesExample:'mes_example',systemPrompt:'system_prompt',postHistory:'post_history_instructions',creatorNotes:'creator_notes'};
    for (const [k, field] of Object.entries(fields)) if (Object.hasOwn(patch,k)) target[field] = text(patch[k]);
    if (Object.hasOwn(patch, 'greetings')) {
      const greetings = arr(patch.greetings);
      target.first_mes = greetings[0]?.content || '';
      target.alternate_greetings = greetings.slice(1).map(g => text(g.content));
    }
    if (raw.data) raw.data = target;
    return normalizeCard(raw);
  }
  function bytesToString(uint) { return new TextDecoder('utf-8').decode(uint); }
  function base64Json(raw) {
    const compact = text(raw).replace(/\s/g,'');
    if (/^[\[{]/.test(compact)) return JSON.parse(raw);
    const bin = atob(compact);
    return JSON.parse(bytesToString(Uint8Array.from(bin, c => c.charCodeAt(0))));
  }
  async function inflate(bytes) {
    if (typeof DecompressionStream !== 'function') throw new Error('此浏览器不支持 PNG 压缩元数据；建议改用 JSON 角色卡导入');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function parsePngCard(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer); const dv = new DataView(arrayBuffer);
    if (bytes.length < 12 || ![137,80,78,71,13,10,26,10].every((v,i)=>v===bytes[i])) throw new Error('这不是有效的 PNG 文件');
    let p = 8, metadata = [];

      const size = dv.getUint32(p); const type = String.fromCharCode(...bytes.slice(p+4,p+8));
      if (size > bytes.length - p - 12) throw new Error('PNG 文件结构损坏');
      const chunk = bytes.slice(p+8,p+8+size); const sep = chunk.indexOf(0);
      if (sep >= 0 && (type === 'tEXt' || type === 'zTXt' || type === 'iTXt')) {
        const keyword = String.fromCharCode(...chunk.slice(0,sep));

          if (type === 'tEXt') content = bytesToString(chunk.slice(sep+1));

      }

    }

    }

  }

  if (typeof module !== 'undefined' && module.exports) module.exports=api;
  if (scope) scope.CardImport=api;
})(typeof window !== 'undefined' ? window : globalThis);

async function syncBook(row){requireHost(state.api?.world?.create);const c=cardOf(row);const entries=sourceEntries(c);if(!entries.length){message('角色卡没有世界书条目，无需创建');return null;}const payload={name:`${c.name} · 剧情世界书`,description:'由角色库管理独立创建，仅绑定线下剧情',entries};let result;if(row.worldId){requireHost(state.api.world.update);result=await state.api.world.update({...payload,id:row.worldId});}else result=await state.api.world.create(payload);const id=result?.book?.id;if(!id)throw Error('世界书同步未返回有效 ID');await saveRow(row,{worldId:id});message('剧情世界书已同步');return id;}
async function syncRegex(row){requireHost(state.api?.regex?.create);const c=cardOf(row);if(!c.scripts.length){message('角色卡没有可识别正则规则');return null;}const rules=c.scripts.map((x,i)=>({...x,id:String(x.id??`rule_${i}`),scriptName:x.scriptName||x.name||`规则 ${i+1}`,findRegex:x.findRegex||x.pattern||'',replaceString:x.replaceString||x.replacement||''}));const payload={name:`${c.name} · 剧情正则`,description:'由角色库管理独立创建，仅绑定线下剧情',rules};let result;if(row.regexId){requireHost(state.api.regex.update);result=await state.api.regex.update({...payload,id:row.regexId});}else result=await state.api.regex.create(payload);const id=result?.regex?.id;if(!id)throw Error('正则同步未返回 ID');await saveRow(row,{regexId:id});message('剧情正则组已同步');return id;}
async function syncAll(row){requireHost(state.api?.story?.updateBindings);if(state.busy)return;state.busy=true;message('正在同步角色、开场与剧情资源…',8000);try{const id=await syncCharacter(row);await syncOpeningSet(row).catch(e=>{console.warn(e);throw e;});const c=cardOf(row);if(sourceEntries(c).length)await syncBook(row);if(c.scripts.length)await syncRegex(row);const previous=await state.api.story.getBindings({characterId:id});const binding={characterId:id};const ownBinding=previous?.binding||{};if(row.worldId)binding.worldBookIds=[...new Set([...(Array.isArray(ownBinding.worldBookIds)?ownBinding.worldBookIds:[]),row.worldId])];if(row.regexId)binding.regexIds=[...new Set([...(Array.isArray(ownBinding.regexIds)?ownBinding.regexIds:[]),row.regexId])];if(binding.worldBookIds||binding.regexIds)await state.api.story.updateBindings(binding);message('已同步角色、开场、世界书与正则（仅线下剧情）');state.tab='binding';await reload();}finally{state.busy=false;}}
async function promoteArchive(row,openingId,defaultName){requireHost(state.api?.story?.promoteOpeningArchive);const d=modal('创建正式剧情分线','此操作会把这个开场的隐藏存档转成可在剧情页面看到的正式分线，不会覆盖当前主线。',async()=>{const name=d.box.querySelector('input').value.trim()||defaultName;await state.api.story.promoteOpeningArchive({openingSetId:row.openingSetId,openingId,branchName:name});await loadArchives(row);message('已经转换为正式剧情分线');},'转换分线');const input=h('input',{value:defaultName,placeholder:'分线名称'});input.style.cssText='width:100%;padding:12px;border-radius:10px;border:1px solid #e7e8ed';d.box.insertBefore(input,d.box.lastChild);}
async function openStory(row){requireHost(state.api?.story?.open);if(!row.hostId)throw Error('先同步角色');await state.api.story.open({characterId:row.hostId});}
function settings(){top('关于与设置','角色库管理 · 个人私有应用',[]);panels.replaceChildren(section('我的数据',[h('div',{class:'notice',text:state.api?'当前运行于小手机 SDK 沙盒。角色信息存储在此 APP 的私有数据库中。':'当前是独立浏览器预览，使用浏览器本地存储。请安装到小手机以启用剧情管理。'}),h('div',{class:'row'},[clickBtn('导出角色库备份',backupLibrary,'primary')])]),section('使用原则',[h('p',{class:'muted',text:'原始卡片未知字段保持原样。导入与同步分开执行，默认不会改变小手机既有角色或聊天。同步使用新版剧情接口，仅绑定线下长文剧情，不会写入线上聊天。'}),h('p',{class:'muted',text:'开发版本 v0.1；不提供一键同步历史聊天存档。选择“切换开场”时自动请求保护旧主线，存档删除必须二次确认。'} )]));}
async function backupLibrary(){const records=state.items.map(r=>({name:r.name,raw:r.raw,sourceName:r.sourceName,sourceType:r.sourceType,hostId:r.hostId,openingSetId:r.openingSetId,worldId:r.worldId,regexId:r.regexId,hasOriginalPng:!!r.mediaRef}));download(new Blob([JSON.stringify({app:'role.library.manager',version:1,exportedAt:now(),note:'原始 PNG 文件需逐个在角色原始数据页单独导出',cards:records},null,2)],{type:'application/json'}),'角色库管理-备份.json');message('已导出角色库备份（不包含原始 PNG 文件）');}
function render(){nav();if(state.page==='library')dashboard();else if(state.page==='import')importScreen();else if(state.page==='detail')detail();else settings();}
async function boot(){document.querySelectorAll('[data-page]').forEach(x=>x.addEventListener('click',()=>switchPage(x.dataset.page)));state.api=await bridge();if(!state.api){state.previewOnly=true;message('当前为独立预览，宿主同步功能不可用',5000);}try{await reload();}catch(e){failure(e);panels.append(h('p',{text:'加载失败，请刷新或检查 APP 私有存储权限。'}));}}
boot().catch(failure);
})();
</script></body></html>
